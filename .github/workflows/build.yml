name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

  package-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter desktop build

      - name: Install rpm tooling (fpm/rpmbuild)
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Package (AppImage / tar.gz / deb / rpm)
        run: pnpm --filter desktop exec electron-builder --linux AppImage tar.gz deb rpm

      - uses: actions/upload-artifact@v4
        with:
          name: nvag-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: error

  package-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter desktop build

      - name: Package (NSIS)
        run: pnpm --filter desktop exec electron-builder --win nsis

      - uses: actions/upload-artifact@v4
        with:
          name: nvag-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  package-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter desktop build

      - name: Package (dmg)
        run: pnpm --filter desktop exec electron-builder --mac dmg

      - uses: actions/upload-artifact@v4
        with:
          name: nvag-macos
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
